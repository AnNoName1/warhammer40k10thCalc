# Visibility only: must never be added to required status checks.
name: Policy Flags
on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  policy-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit messages
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash ./scripts/scan-policy-flags.sh "$BASE_SHA..$HEAD_SHA" | tee flags.tsv
          echo "labels=$(cut -f1 flags.tsv | sort -u | paste -sd' ' -)" >> "$GITHUB_OUTPUT"

      # Labels are only ever added, so they accumulate across pushes; the
      # issues API ignores labels already present and creates missing ones.
      - name: Apply labels
        if: steps.scan.outputs.labels != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FLAGS: ${{ steps.scan.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=()
          for flag in $FLAGS; do args+=(-f "labels[]=policy:$flag"); done
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" "${args[@]}" > /dev/null
